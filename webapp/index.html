<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rimex X-Ray</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --card: #000000;
      --border: #222222;
      --text: #FFFFFF;
      --muted: #777777;
      --accent: #FFFFFF;
      --mono: "JetBrains Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      font-size: 15px;
      padding: 16px;
      min-height: 100vh;
    }
    header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
    h1 { font-size: 16px; font-weight: 600; letter-spacing: 3px; }
    h1 span { font-weight: 300; }
    .tagline { color: var(--muted); font-size: 13px; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input {
      flex: 1;
      min-width: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 12px;
      outline: none;
    }
    input:focus { border-color: var(--text); }
    button {
      background: var(--text);
      border: 1px solid var(--text);
      border-radius: 0;
      color: var(--bg);
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 18px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.4; }
    .card {
      background: var(--card);
      border-top: 1px solid var(--border);
      padding: 16px 0;
    }
    .card h2 { font-size: 11px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 8px; }
    .token-title { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
    .token-name { color: var(--muted); font-size: 14px; }
    .address { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 6px; }
    .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
    .row:first-of-type { border-top: 0; }
    .row .label { color: var(--muted); }
    .row .value { font-family: var(--mono); font-weight: 500; text-align: right; }
    .safe { color: var(--text); }
    .warning { border: 1px solid var(--text); padding: 2px 6px; }
    .danger { background: var(--text); color: var(--bg); padding: 2px 6px; font-weight: 600; text-transform: uppercase; }
    .unknown { color: var(--muted); }
    .notice { color: var(--muted); font-size: 13px; padding: 4px 0; }
    .error { color: var(--text); text-align: center; padding: 24px 0; }
    .hint { color: var(--muted); text-align: center; padding: 32px 0; font-size: 14px; line-height: 1.5; }
    .links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .links a {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0;
      color: var(--text);
      font-size: 12px;
      letter-spacing: 1px;
      padding: 10px 0;
      text-align: center;
      text-decoration: none;
    }
    .footer { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; }
    .spinner { text-align: center; color: var(--muted); padding: 32px 0; font-family: var(--mono); letter-spacing: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>RIMEX <span>X-RAY</span></h1>
    <div class="tagline">Solana token scanner</div>
  </header>

  <form id="scan-form">
    <input id="address" placeholder="Paste contract address" autocomplete="off" spellcheck="false">
    <button id="scan-button" type="submit">Scan</button>
  </form>

  <main id="result">
    <div class="hint">Paste a Solana token contract address<br>to check it in under a second.</div>
  </main>

  <template id="report-template">
    <div class="card">
      <div class="token-title" data-field="symbol"></div>
      <div class="token-name" data-field="name"></div>
      <div class="address" data-field="address"></div>
    </div>
    <div class="card">
      <h2>Market</h2>
      <div class="row"><span class="label">Price</span><span class="value" data-field="price"></span></div>
      <div class="row"><span class="label">Liquidity</span><span class="value" data-field="liquidity"></span></div>
      <div class="row"><span class="label">Volume 24h</span><span class="value" data-field="volume"></span></div>
    </div>
    <div class="card">
      <h2>X-Ray security</h2>
      <div class="row"><span class="label">Mint Authority</span><span class="value" data-field="mint"></span></div>
      <div class="row"><span class="label">Freeze Authority</span><span class="value" data-field="freeze"></span></div>
      <div class="row"><span class="label">LP locked</span><span class="value" data-field="lp"></span></div>
      <div class="row"><span class="label">Top 10 holders</span><span class="value" data-field="top10"></span></div>
      <div class="row"><span class="label">Holders</span><span class="value" data-field="holders"></span></div>
      <div class="row"><span class="label">RugCheck risk</span><span class="value" data-field="risk"></span></div>
      <div data-field="notices"></div>
    </div>
    <div class="links" data-field="links"></div>
    <div class="footer" data-field="elapsed"></div>
  </template>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#000000");
    tg.setBackgroundColor("#000000");

    const form = document.getElementById("scan-form");
    const input = document.getElementById("address");
    const button = document.getElementById("scan-button");
    const result = document.getElementById("result");
    const template = document.getElementById("report-template");

    function formatMoney(value) {
      if (value === null) return "—";
      const number = Number(value);
      if (number >= 1) {
        return "$" + number.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }
      return "$" + String(value).replace(/0+$/, "");
    }

    function authority(value, loaded) {
      if (!loaded) return ["unknown", "unknown"];
      if (value === null) return ["disabled", "safe"];
      return ["enabled", "danger"];
    }

    function setField(root, name, text, level) {
      const element = root.querySelector(`[data-field="${name}"]`);
      element.textContent = text;
      if (level) element.classList.add(level);
    }

    function showMessage(className, text) {
      const div = document.createElement("div");
      div.className = className;
      div.textContent = text;
      result.replaceChildren(div);
    }

    function renderReport(report) {
      const view = template.content.cloneNode(true);
      setField(view, "symbol", report.symbol ?? "?");
      setField(view, "name", report.name ?? "Unknown token");
      setField(view, "address", report.address);
      setField(view, "price", formatMoney(report.price_usd));
      setField(view, "liquidity", formatMoney(report.liquidity_usd));
      setField(view, "volume", formatMoney(report.volume_24h));
      setField(view, "mint", ...authority(report.mint_authority, report.authorities_loaded));
      setField(view, "freeze", ...authority(report.freeze_authority, report.authorities_loaded));
      setField(view, "lp", report.lp_locked_pct === null ? "—" : `${Number(report.lp_locked_pct).toFixed(1)}%`, report.lp_level);
      setField(view, "top10", report.top10_holders_pct === null ? "—" : `${Number(report.top10_holders_pct).toFixed(1)}%`, report.top10_level);
      setField(view, "holders", report.holders_count === null ? "—" : report.holders_count.toLocaleString("en-US"));
      setField(view, "risk", report.risk_score === null ? "—" : `${report.risk_score} (lower is safer)`);
      const source = report.market_source ? ` · market data: ${report.market_source}` : "";
      setField(view, "elapsed", `Scanned in ${report.elapsed.toFixed(2)}s${source}`);

      const notices = view.querySelector('[data-field="notices"]');
      for (const text of [...report.risks.map((risk) => `Risk: ${risk}`), ...report.errors]) {
        const div = document.createElement("div");
        div.className = "notice";
        div.textContent = "⚠ " + text;
        notices.append(div);
      }

      const links = view.querySelector('[data-field="links"]');
      const targets = {
        DexScreener: `https://dexscreener.com/solana/${report.address}`,
        RugCheck: `https://rugcheck.xyz/tokens/${report.address}`,
        Solscan: `https://solscan.io/token/${report.address}`,
      };
      for (const [title, url] of Object.entries(targets)) {
        const link = document.createElement("a");
        link.href = url;
        link.textContent = title;
        link.addEventListener("click", (event) => {
          event.preventDefault();
          tg.openLink(url);
        });
        links.append(link);
      }

      result.replaceChildren(view);
    }

    const MARKET_ERROR_PREFIXES = ["DexScreener:", "GeckoTerminal:"];

    async function loadMarketFromBrowser(address) {
      const response = await fetch(`https://api.dexscreener.com/tokens/v1/solana/${encodeURIComponent(address)}`);
      if (!response.ok) throw new Error(`DexScreener HTTP ${response.status}`);
      const pairs = await response.json();
      if (!Array.isArray(pairs) || pairs.length === 0) throw new Error("No pairs");
      const pair = pairs.reduce((best, current) =>
        (current.liquidity?.usd ?? 0) > (best.liquidity?.usd ?? 0) ? current : best
      );
      return {
        symbol: pair.baseToken?.symbol ?? null,
        name: pair.baseToken?.name ?? null,
        price_usd: pair.priceUsd ?? null,
        liquidity_usd: pair.liquidity?.usd ?? null,
        volume_24h: pair.volume?.h24 ?? null,
      };
    }

    async function loadAuthoritiesFromBrowser(address) {
      const response = await fetch("https://solana-rpc.publicnode.com", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: 1,
          method: "getAccountInfo",
          params: [address, { encoding: "jsonParsed" }],
        }),
      });
      if (!response.ok) throw new Error(`Solana RPC HTTP ${response.status}`);
      const parsed = (await response.json())?.result?.value?.data?.parsed;
      if (!parsed || parsed.type !== "mint") throw new Error("Not a token mint");
      return {
        authorities_loaded: true,
        mint_authority: parsed.info?.mintAuthority ?? null,
        freeze_authority: parsed.info?.freezeAuthority ?? null,
      };
    }

    const TOP10_WARNING_PCT = 35;
    const TOP10_DANGER_PCT = 70;

    function top10Level(pct) {
      if (pct >= TOP10_DANGER_PCT) return "danger";
      if (pct >= TOP10_WARNING_PCT) return "warning";
      return "safe";
    }

    async function loadHoldersFromBrowser(address) {
      const response = await fetch(
        `https://api.geckoterminal.com/api/v2/networks/solana/tokens/${encodeURIComponent(address)}/info`,
        { headers: { Accept: "application/json" } }
      );
      if (!response.ok) throw new Error(`GeckoTerminal HTTP ${response.status}`);
      const holders = (await response.json())?.data?.attributes?.holders;
      const top10 = holders?.distribution_percentage?.top_10;
      if (top10 === undefined || top10 === null) throw new Error("No holders data");
      return {
        holders_count: holders.count ?? null,
        top10_holders_pct: top10,
        top10_level: top10Level(Number(top10)),
      };
    }

    function withoutErrors(errors, prefixes) {
      return errors.filter((error) => !prefixes.some((prefix) => error.startsWith(prefix)));
    }

    async function fillMissingData(report) {
      const [market, authorities, holders] = await Promise.allSettled([
        report.market_source ? Promise.reject() : loadMarketFromBrowser(report.address),
        report.authorities_loaded ? Promise.reject() : loadAuthoritiesFromBrowser(report.address),
        report.top10_holders_pct !== null ? Promise.reject() : loadHoldersFromBrowser(report.address),
      ]);
      let filled = report;
      if (market.status === "fulfilled") {
        filled = {
          ...filled,
          ...market.value,
          market_source: "DexScreener (direct)",
          errors: withoutErrors(filled.errors, MARKET_ERROR_PREFIXES),
        };
      }
      if (authorities.status === "fulfilled") {
        filled = {
          ...filled,
          ...authorities.value,
          errors: withoutErrors(filled.errors, ["Solana RPC:"]),
        };
      }
      if (holders.status === "fulfilled") {
        filled = {
          ...filled,
          ...holders.value,
          errors: withoutErrors(filled.errors, ["Holders:"]),
        };
      }
      return filled;
    }

    async function scan(address) {
      button.disabled = true;
      result.innerHTML = '<div class="spinner">Scanning…</div>';
      try {
        const response = await fetch("/api/scan", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Telegram-Init-Data": tg.initData,
          },
          body: JSON.stringify({ address }),
        });
        const data = await response.json();
        if (!response.ok) {
          showMessage("error", typeof data.detail === "string" ? data.detail : "Request failed");
          tg.HapticFeedback.notificationOccurred("error");
          return;
        }
        const report = await fillMissingData(data);
        renderReport(report);
        const dangerous = report.mint_authority || report.freeze_authority || report.lp_level === "danger" || report.top10_level === "danger";
        tg.HapticFeedback.notificationOccurred(dangerous ? "warning" : "success");
      } catch {
        showMessage("error", "Network error. Try again.");
      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const address = input.value.trim();
      if (address) {
        input.blur();
        scan(address);
      }
    });

    const SOLANA_ADDRESS_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
    const startAddress = tg.initDataUnsafe?.start_param || new URLSearchParams(location.search).get("address");
    if (startAddress && SOLANA_ADDRESS_RE.test(startAddress)) {
      input.value = startAddress;
      scan(startAddress);
    }
  </script>
</body>
</html>
