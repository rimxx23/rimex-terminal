<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rimex X-Ray</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>RIMEX <span>X-RAY</span></h1>
      <div class="tagline">Solana token scanner</div>
    </div>
    <button id="profile-button" class="profile-button" type="button" aria-label="Open profile"></button>
  </header>

  <section id="scan-view">
    <form id="scan-form">
      <input id="address" placeholder="Paste contract address" autocomplete="off" spellcheck="false">
      <button id="scan-button" type="submit">Scan</button>
    </form>
    <main id="result"></main>
  </section>

  <section id="profile-view" hidden>
    <button id="back-button" class="link-button back" type="button">← Back to scanner</button>
    <div id="profile-content"></div>
  </section>

  <div id="toast" class="toast" role="status"></div>

  <template id="report-template">
    <div class="verdict" data-field="verdict">
      <div class="verdict-title" data-field="verdict-title"></div>
      <div class="verdict-reasons" data-field="verdict-reasons"></div>
    </div>
    <div class="card">
      <div class="token-title" data-field="symbol"></div>
      <div class="token-name" data-field="name"></div>
      <div class="known" data-field="known"></div>
      <div class="address" data-field="address" title="Tap to copy"></div>
    </div>
    <div class="card">
      <h2>Market</h2>
      <div class="row"><span class="label">Price</span><span class="value" data-field="price"></span></div>
      <div class="row"><span class="label">Liquidity</span><span class="value" data-field="liquidity"></span></div>
      <div class="row"><span class="label">Volume 24h</span><span class="value" data-field="volume"></span></div>
      <div class="row"><span class="label">Pool age</span><span class="value" data-field="pool-age"></span></div>
    </div>
    <div class="card">
      <h2>X-Ray security</h2>
      <div class="row"><span class="label">Mint Authority</span><span class="value" data-field="mint"></span></div>
      <div class="row"><span class="label">Freeze Authority</span><span class="value" data-field="freeze"></span></div>
      <div class="row"><span class="label">Honeypot</span><span class="value" data-field="honeypot"></span></div>
      <div class="row"><span class="label">LP locked</span><span class="value" data-field="lp"></span></div>
      <div class="row"><span class="label">Top 10 holders</span><span class="value" data-field="top10"></span></div>
      <div class="row"><span class="label">Holders</span><span class="value" data-field="holders"></span></div>
      <div class="row"><span class="label">Developer holds</span><span class="value" data-field="dev"></span></div>
      <div class="row"><span class="label">RugCheck risk</span><span class="value" data-field="risk"></span></div>
      <div data-field="notices"></div>
    </div>
    <div class="links" data-field="links"></div>
    <div class="footer" data-field="elapsed"></div>
  </template>
</body>
</html>
